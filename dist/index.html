<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 620px at 50% -10%, #16283f 0%, #0a1220 58%, #060a12 100%);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, "Helvetica Neue", sans-serif;
      color: #dbe4f0;
    }
    .card { text-align: center; padding: 32px; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 22px;
      border-radius: 19px;
      background: linear-gradient(135deg, #2ee6c8, #4d7cfe);
      box-shadow: 0 14px 44px rgba(77, 124, 254, 0.35);
      display: grid; place-items: center;
      font-weight: 800; font-size: 26px; color: #04121a; letter-spacing: 0.5px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0; color: #8fa3bb; font-size: 14px; }
    .spinner {
      width: 22px; height: 22px; margin: 26px auto 0;
      border: 2px solid rgba(143, 163, 187, 0.35);
      border-top-color: #2ee6c8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none;
      max-width: 640px; margin: 26px auto 0; text-align: left;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px; padding: 14px 16px;
      font-size: 13px; line-height: 1.6; color: #fecaca;
      white-space: pre-wrap; word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">DSH</div>
    <h1>DeepSeek Harness</h1>
    <p id="status">正在启动 Web UI（npx @deepseek-ai/dsh web）…</p>
    <div class="spinner" id="spinner"></div>
    <div id="error"></div>
  </div>
</body>
</html>
