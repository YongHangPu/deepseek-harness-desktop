# GitHub Actions：跨平台 × 多架构自动构建并发布安装包。
#
# 触发方式：
#   1. 推送 v* 标签（正式发布，推荐）：
#        a. 先修改 src-tauri/tauri.conf.json 里的 "version"（例如 1.0.1）
#        b. git tag v1.0.1 && git push origin v1.0.1
#        c. 构建完成后到 GitHub Releases 确认草稿（releaseDraft: true）并发布
#   2. 手动触发（Actions 页 Run workflow，用于测试构建）：
#        填入 tag 输入（默认 v0.0.0-test，重复触发会覆盖同名草稿 Release）；
#        产物会出现在同名的草稿 Release 里，测试完删除该草稿与标签即可。
#
# 产物（全部自动上传到同一个 Release）：
#   Windows：x64 / x86 / arm64 的 NSIS 安装程序（setup.exe）+ MSI + 便携 zip
#   macOS：  通用（universal）dmg / app，同时支持 Intel 与 Apple Silicon
#   Linux：  amd64 / arm64 的 deb、rpm、AppImage + 便携 tar.gz
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签名（仅手动触发时使用）'
        required: false
        default: 'v0.0.0-test'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows ----
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: windows-latest
            target: i686-pc-windows-msvc
            arch: x86
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
          # ---- macOS（单次构建产出 universal dmg/app）----
          - platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          # ---- Linux ----
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          # 原生 ARM64 Linux runner（公开仓库可用；若你的仓库不可用，
          # 删除此条目即可，或改用 cross 容器交叉编译）
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust 工具链与目标架构
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets || matrix.target }}

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: 安装 npm 依赖（@tauri-apps/cli）
        run: npm install

      - name: 构建并发布（NSIS/MSI、dmg、deb/rpm/AppImage）
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 标签推送时用标签名；手动触发时用手动输入的 tag（默认 v0.0.0-test）
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: 'DeepSeek Harness __VERSION__'
          releaseBody: |
            DeepSeek Harness 桌面启动器：双击即启动 DeepSeek Harness Web GUI，无需终端。
            （社区项目，与 DeepSeek 官方无隶属关系。）

            ## ✨ 特性

            - 双击即开：自动拉起 `npx @deepseek-ai/dsh web` 并在原生窗口打开；已有服务则直接附着
            - 内置设置界面（托盘 → 设置）：可视化配置 `DSH_HOME` 与工作目录，迁移过 `.dsh` 也能找回历史会话
            - 会话进行中关闭窗口会弹窗确认，避免误关
            - 启动失败自动重试；托盘“停止服务并退出”一键清理后台服务
            - 单实例运行；复用 npx 命令，官方发新版自动跟随 `latest`

            ## 📦 选择安装包

            **Windows**
            - `*_x64-setup.exe` / `*_x86-setup.exe` / `*_arm64-setup.exe` —— NSIS 安装程序（当前用户，免管理员）
            - `*.msi` —— MSI 安装程序（按机器安装，需管理员）
            - `*_windows-*.zip` —— 免安装便携包（解压后双击 dsh-desktop.exe 即可）

            **macOS**
            - `*_universal.dmg` —— 通用安装包，同时支持 Intel 与 Apple Silicon

            **Linux**
            - `.deb` / `.rpm` / `.AppImage` —— 分 `amd64` 与 `arm64` 两个架构
            - `*_linux-*.tar.gz` —— 免安装便携包（解压后运行 `./dsh-desktop`）

            ## 🚀 使用前提

            - 需要已安装 **Node.js**（程序通过 npx 启动 dsh，首次启动会自动下载）；如未安装，请从 <https://nodejs.org> 安装

            ## ⚠️ 已知说明

            - 安装包尚未做代码签名：Windows 首次运行如遇 SmartScreen 提示，请点“更多信息 → 仍要运行”；macOS 如遇 Gatekeeper 拦截，请右键应用选择“打开”
            - Linux 的 AppImage 首次运行前需要 `chmod +x <文件名>.AppImage`
            - 32 位架构仅提供 Windows x86 版本（macOS 已无 32 位；Tauri 2 不支持 32 位 Linux）

            ## 🔗 链接

            - 源码与问题反馈：<https://github.com/YongHangPu/deepseek-harness-desktop>
            - 上游项目：<https://github.com/deepseek-ai/deepseek-harness>

            ---

            ## 📝 本次变更

            > 发布前请在这里补充本版本的改动说明（草稿状态下可直接编辑）。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: 打包 Windows 便携 zip
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = node -p "require('./package.json').version"
          $exe = "src-tauri/target/${{ matrix.target }}/release/dsh-desktop.exe"
          $zip = "DeepSeek Harness_${v}_windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          gh release upload "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}" $zip --clobber

      - name: 打包 Linux 便携 tar.gz
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          bin=$(find src-tauri/target -path "*/${{ matrix.target }}/release/dsh-desktop" -type f | head -n 1)
          pkg="deepseek-harness_${v}_linux-${{ matrix.arch }}"
          mkdir -p "$pkg"
          cp "$bin" "$pkg/dsh-desktop"
          cp assets/dsh-desktop.desktop "$pkg/dsh-desktop.desktop"
          cp src-tauri/icons/128x128.png "$pkg/dsh-desktop.png"
          chmod +x "$pkg/dsh-desktop"
          tar czf "DeepSeek Harness_${v}_linux-${{ matrix.arch }}.tar.gz" "$pkg"
          gh release upload "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}" "DeepSeek Harness_${v}_linux-${{ matrix.arch }}.tar.gz" --clobber

